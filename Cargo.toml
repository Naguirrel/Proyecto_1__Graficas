[package]
name = "Proyecto_1_Raycasting"
version = "0.1.0"
edition = "2024"

[dependencies]
gilrs = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
minifb = "0.28"
rodio = "0.22.2"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winuser"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
